name: Integrar Rick IA no App

on:
  push:
    branches:
      - feature/rick-ai-v2
    paths:
      - scripts/apply-rick-ai-integration.mjs

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rick-ai-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-rick-ai-integration.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "feat: mount Rick IA in app"
          git push origin HEAD:feature/rick-ai-v2
