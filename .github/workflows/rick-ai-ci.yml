name: Verificar Rick IA V2

on:
  push:
    branches:
      - feature/rick-ai-v2
      - feature/rick-ai-personality-voice
      - feature/rick-ai-mic-hotfix
      - feature/rick-ai-text-focus
      - feature/rick-ai-memory-context
      - feature/rick-ai-conversations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
