name: Verificar Rick IA V2

on:
  push:
    branches:
      - feature/rick-ai-v2
      - feature/rick-ai-personality-voice
      - feature/rick-ai-mic-hotfix
      - feature/rick-ai-text-focus
      - feature/rick-ai-memory-context
      - feature/rick-ai-conversations
      - feature/rick-ai-proactivity
      - feature/rick-ai-module-awareness
      - feature/rick-ai-module-actions
      - feature/rick-ai-module-summary
      - feature/rick-ai-changes
      - feature/rick-ai-selective-memory
      - feature/rick-ai-priority
      - feature/rick-ai-briefing
      - feature/rick-ai-conversational-actions
      - feature/daiane-dual-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
